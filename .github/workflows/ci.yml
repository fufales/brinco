name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']

# Ningún job hereda permisos: cada uno pide solo lo que usa.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Aquí corre código de las dependencias (npm ci, npm test): solo lectura.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Comprobar que el tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Empaquetar brinco-web.zip
        run: |
          cd dist && zip -r ../brinco-web.zip . && cd ..
          sha256sum brinco-web.zip > brinco-web.zip.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brinco-web
          path: |
            brinco-web.zip
            brinco-web.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    # Único job con permiso de escritura: solo publica lo que ya empaquetó ci.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brinco-web
      - name: Verificar el paquete antes de publicarlo
        run: sha256sum -c brinco-web.zip.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            brinco-web.zip
            brinco-web.zip.sha256
