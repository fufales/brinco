name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Empaquetar brinco-web.zip
        run: |
          cd dist && zip -r ../brinco-web.zip . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brinco-web
          path: brinco-web.zip

      - name: Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: brinco-web.zip

  # Deploy via webhook disabled for now; keepalive-based pull-CD handles it.
  # Every 5 min, keepalive.sh checks latest brinco release and auto-deploys.